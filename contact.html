<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Remy Portfolio</title>

    <!-- SEO -->
    <meta name="description" content="Contact Remy Madja for projects, collaboration, or inquiries.">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/contact.css">
</head>

<body>

<!-- NAVIGATION -->
<header>
    <nav aria-label="Main navigation">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./work.html">Work</a>
        <a href="./contact.html" aria-current="page">Contact</a>
    </nav>
</header>

<!-- MAIN CONTENT -->
<main class="contact-page">

    <section class="contact-box">

        <h1>Contact Me</h1>

        <!-- CONTACT INFO -->
        <div class="contact-info">
            <p><strong>Email:</strong> r.madja@unasat.sr</p>
            <p><strong>Phone:</strong> +597 892 3404</p>

            <p>
                <a href="https://github.com/Remymadja" target="_blank" rel="noopener noreferrer">
                    GitHub Profile
                </a>
            </p>
        </div>

        <!-- CONTACT FORM -->
        <form id="contactForm">

            <label for="name">Name</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                placeholder="Your Name" 
                required
                autocomplete="name">

            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="Your Email" 
                required
                autocomplete="email">

            <label for="message">Message</label>
            <textarea 
                id="message" 
                name="message" 
                placeholder="Write your message..." 
                required
                rows="5"></textarea>

            <button type="submit">Send Message</button>

        </form>

    </section>

</main>

<!-- FOOTER AREA -->
<footer>
    <p>© 2026 Remy Madja. All rights reserved.</p>
</footer>

<!-- SCRIPTS (defer = safer on Netlify) -->
<script src="./js/main.js" defer></script>
<script src="./js/contact.js" defer></script>

</body>
</html>
